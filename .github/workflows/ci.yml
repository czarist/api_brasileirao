name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: brasileirao
          POSTGRES_PASSWORD: brasileirao
          POSTGRES_DB: brasileirao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brasileirao -d brasileirao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          DATABASE_URL: postgres://brasileirao:brasileirao@127.0.0.1:5432/brasileirao?sslmode=disable
      - name: OpenAPI
        run: go test ./internal/httpapi -count=1 -run TestOpenAPIDocument
      # Go 1.24.3 still reports stdlib, x/net, and x/text findings fixed only in Go 1.25+.
      - name: Vulnerabilities
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Image
        run: docker build -t api-brasileirao:ci .
