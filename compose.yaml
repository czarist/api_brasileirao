# Development stack. The database password is local-only.
# Do not publish port 5432 or use these credentials in production.
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: brasileirao
      POSTGRES_PASSWORD: brasileirao
      POSTGRES_DB: brasileirao
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasileirao -d brasileirao"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    image: api-brasileirao:dev
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://brasileirao:brasileirao@postgres:5432/brasileirao?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: api-brasileirao:dev
    environment:
      DATABASE_URL: postgres://brasileirao:brasileirao@postgres:5432/brasileirao?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: runtime
    image: api-brasileirao:dev
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://brasileirao:brasileirao@postgres:5432/brasileirao?sslmode=disable
      SYNC_COMPETITION: brasileirao-serie-a
      SYNC_YEAR: "2026"
      SYNC_INTERVAL: 1h
      SOURCE_BASE_URL: https://www.cbf.com.br
      SOURCE_MIN_INTERVAL: 1s
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: api-brasileirao:test
    working_dir: /src
    volumes:
      - .:/src
    environment:
      DATABASE_URL: postgres://brasileirao:brasileirao@postgres:5432/brasileirao?sslmode=disable
      CGO_ENABLED: "1"
    entrypoint: ["go", "test", "-race", "./..."]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
